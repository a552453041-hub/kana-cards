<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#efe8da">
<title>片假名练习卡</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%23b4402a%22/%3E%3Ctext x=%2232%22 y=%2246%22 font-size=%2240%22 text-anchor=%22middle%22 fill=%22%23fbf8f1%22 font-family=%22serif%22%3E%E3%82%A2%3C/text%3E%3C/svg%3E">
<style>
:root{
  --paper:#efe8da; --card:#fbf8f1; --ink:#2a2420; --ink2:#6f655b; --line:#d6cab4;
  --shu:#b4402a; --ai:#2f4660;
  --jp:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP","Source Han Serif JP","Songti SC","STSong",serif;
  --ui:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper)}
.app{
  position:fixed;inset:0;overflow:hidden;
  background:var(--paper);
  background-image:radial-gradient(rgba(120,90,50,.06) 1px,transparent 1px);background-size:5px 5px;
  color:var(--ink);font-family:var(--ui);
  display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 20px);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
/* 模式切换 */
.seg{position:relative;display:flex;background:rgba(42,36,32,.07);border-radius:999px;padding:4px;gap:4px;z-index:3}
.seg .thumb{position:absolute;left:4px;top:4px;width:76px;height:36px;border-radius:999px;background:var(--card);
  box-shadow:0 1px 3px rgba(60,40,20,.18);will-change:transform}
.seg button{position:relative;width:76px;height:36px;border:0;background:transparent;font:500 15px/1 var(--ui);color:var(--ink2);
  border-radius:999px;cursor:pointer;letter-spacing:.1em;transition:color .25s}
.seg button.on{color:var(--ink)}
/* 牌堆 */
.stage{position:relative;z-index:2;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(18px,4vh,34px);min-height:0}
.deck{position:relative;width:min(78vw,330px);aspect-ratio:3/3.6;max-height:46vh;perspective:1100px;touch-action:none;cursor:grab}
.deck:active{cursor:grabbing}
.card{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform;--lift:0}
.face{
  position:absolute;inset:0;border-radius:14px;overflow:hidden;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,
    0 calc(8px + 22px * var(--lift)) calc(22px + 30px * var(--lift)) -12px rgba(70,45,20,.38),
    0 2px 5px rgba(70,45,20,.08);
}
.front{background:var(--card)}
.front::before{content:"";position:absolute;inset:9px;border:1px solid var(--shu);border-radius:8px;opacity:.55}
.front::after{content:"";position:absolute;inset:13px;border:1px solid var(--shu);border-radius:5px;opacity:.22}
.back{transform:rotateY(180deg);background:#a8392a var(--seigaiha) center/cover no-repeat}
.back::before{content:"";position:absolute;inset:9px;border:1.5px solid rgba(250,236,226,.75);border-radius:8px}
.back::after{content:"";position:absolute;inset:14px;border:1px solid rgba(250,236,226,.4);border-radius:5px}
.kata{font-family:var(--jp);font-weight:600;line-height:1;white-space:nowrap;position:relative;color:var(--ink)}
/* 答案 */
.ans{width:min(86vw,360px);height:138px;position:relative;cursor:pointer}
.veil,.shown{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center}
.veil{flex-direction:row;justify-content:center;gap:14px;top:24px}
.veil i{width:9px;height:9px;border-radius:50%;background:var(--line);animation:breath 2.4s ease-in-out infinite}
.veil i:nth-child(2){animation-delay:.2s}.veil i:nth-child(3){animation-delay:.4s}
@keyframes breath{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.35);opacity:1}}
.shown{gap:12px}
.hira{font-family:var(--jp);font-weight:600;line-height:1.1;color:var(--shu);white-space:nowrap}
.hira span{display:inline-block;will-change:transform,opacity}
.sub{font:400 17px/1.3 var(--ui);color:var(--ink2);letter-spacing:.06em;white-space:nowrap}
.sub .ro{font-family:Georgia,"Times New Roman",serif;font-style:italic;letter-spacing:.08em}
.sub .zh{margin-left:.9em}
.ans.hide .shown{visibility:hidden}
.ans.hide .sub{opacity:0;transform:translateY(8px)}
.ans:not(.hide) .sub{transition:opacity .35s .18s,transform .45s .18s cubic-bezier(.2,1.6,.4,1)}
.ans:not(.hide) .veil{display:none}
/* 按钮 */
.bar{position:relative;z-index:1;display:flex;gap:14px;width:min(86vw,360px);align-items:center}
.btn{border:0;cursor:pointer;font:500 17px/1 var(--ui);letter-spacing:.2em;
  transition:transform .5s cubic-bezier(.25,2,.45,1),background-color .3s,box-shadow .3s}
.btn:active{transform:scale(.92);transition-duration:.08s}
.voice{position:relative;width:56px;height:56px;flex:none;border-radius:50%;background:var(--card);color:var(--ai);
  box-shadow:0 0 0 1px var(--line) inset,0 3px 10px -4px rgba(70,45,20,.3);display:grid;place-items:center}
.voice svg{width:26px;height:26px;transition:color .2s}
.voice.playing{color:var(--shu)}
.voice::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--shu);opacity:0;pointer-events:none}
.voice.playing::after{animation:ring 1s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.55);opacity:0}}
.main{flex:1;height:56px;border-radius:28px;background:var(--ai);color:#f6f1e6;box-shadow:0 6px 16px -8px rgba(30,45,70,.6)}
.main.next{background:var(--shu);box-shadow:0 6px 16px -8px rgba(150,50,30,.6)}
@media (max-height:620px){.ans{height:112px}}
</style>
</head>
<body>
<div class="app">
  <div class="seg" id="seg">
    <div class="thumb" id="thumb"></div>
    <button data-mode="kana" class="on">单字</button>
    <button data-mode="word">单词</button>
  </div>

  <main class="stage">
    <div class="deck" id="deck"></div>
    <div class="ans hide" id="ans">
      <div class="veil"><i></i><i></i><i></i></div>
      <div class="shown">
        <div class="hira" id="hira"></div>
        <div class="sub"><span class="ro" id="ro"></span><span class="zh" id="zh"></span></div>
      </div>
    </div>
  </main>

  <div class="bar">
    <button class="btn voice" id="voice" aria-label="发音">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor" fill-opacity=".12"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18.2 6.5a7.5 7.5 0 0 1 0 11"/></svg>
    </button>
    <button class="btn main" id="main">查看</button>
  </div>
</div>

<script src="kana.js?v=2"></script>
<script>
(function(){
  var K = window.KANA;
  var reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  var $ = function(id){ return document.getElementById(id); };
  var deck = $('deck'), ans = $('ans'), hira = $('hira'), ro = $('ro'), zh = $('zh'),
      mainBtn = $('main'), voice = $('voice'), thumb = $('thumb');

  /* ---------- 题库 ---------- */
  var pools = {
    // 清音放两份，出现得多一些
    kana: K.SEION.concat(K.SEION, K.DAKUON, K.YOON).map(function(k){ return {k:k, zh:''}; }),
    word: K.WORDS.map(function(w){ return {k:w[0], zh:w[1]}; })
  };
  var bags = {kana:[], word:[]}, last = {kana:null, word:null};
  var mode = 'kana';
  try { var sm = localStorage.getItem('kc-mode'); if (sm === 'word' || sm === 'kana') mode = sm; } catch(e){}
  function draw(){
    var bag = bags[mode];
    if (!bag.length) {
      bag = pools[mode].slice();
      for (var i = bag.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = bag[i]; bag[i] = bag[j]; bag[j] = t; }
      bags[mode] = bag;
    }
    var it = bag.pop();
    if (last[mode] && it.k === last[mode].k && bag.length) { bag.unshift(it); it = bag.pop(); }
    return (last[mode] = it);
  }

  /* ---------- 物理：弹簧 + 抛掷，一个 rAF 循环统一驱动 ---------- */
  var anims = [], ticking = false, lastT = 0;
  function loop(t){
    var dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000)); lastT = t;
    var dirty = [], dones = [], keep = [];
    for (var i = 0; i < anims.length; i++) {
      var a = anims[i], alive = a.step(dt);
      if (dirty.indexOf(a) < 0) dirty.push(a);
      if (alive) keep.push(a); else if (a.done) dones.push(a.done);
    }
    anims = keep;
    var seen = [];
    for (i = 0; i < dirty.length; i++) if (seen.indexOf(dirty[i].el) < 0) { seen.push(dirty[i].el); dirty[i].apply(dirty[i].el); }
    for (i = 0; i < dones.length; i++) dones[i]();
    if (anims.length) requestAnimationFrame(loop); else ticking = false;
  }
  function run(a){ anims.push(a); if (!ticking) { ticking = true; lastT = performance.now(); requestAnimationFrame(loop); } }
  function stopEl(el){ anims = anims.filter(function(a){ return a.el !== el; }); }
  // 阻尼弹簧：k 刚度，c 阻尼，v 初速度
  function spring(obj, key, to, o, el, apply, done){
    anims = anims.filter(function(b){ return !(b.obj === obj && b.key === key); });
    if (reduce) { obj[key] = to; apply(el); if (done) done(); return; }
    var k = o.k || 300, c = o.c || 24, eps = o.eps || 0.2, v = o.v || 0;
    var a = {el:el, apply:apply, obj:obj, key:key, done:done};
    a.step = function(dt){
      var x = obj[key], n = Math.max(1, Math.ceil(dt * 240)), h = dt / n;
      for (var i = 0; i < n; i++) { var acc = -k * (x - to) - c * v; v += acc * h; x += v * h; }
      obj[key] = x;
      if (o.onStep) o.onStep(x, v);
      if (Math.abs(v) < eps * 20 && Math.abs(x - to) < eps) { obj[key] = to; return false; }
      return true;
    };
    run(a);
  }
  var EPS = {x:.3, y:.3, rot:.15, ry:.2, s:.0008, lift:.004};
  function animate(el, target, o, done){
    var keys = Object.keys(target), left = keys.length;
    keys.forEach(function(key){
      var oo = {k:o.k, c:o.c, eps:EPS[key] || .2, v:o.v};
      spring(st(el), key, target[key], oo, el, apply, function(){ if (--left === 0 && done) done(); });
    });
  }

  /* ---------- 牌 ---------- */
  var REST   = {x:0, y:0,  rot:0,    ry:0,   s:1};
  var UNDER1 = {x:0, y:14, rot:-2.4, ry:180, s:.95};
  var UNDER2 = {x:3, y:26, rot:2.2,  ry:180, s:.9};
  function st(el){ return el._s || (el._s = {x:0, y:0, rot:0, ry:0, s:1, lift:0}); }
  function apply(el){
    var s = st(el), flip = Math.abs(Math.sin(s.ry * Math.PI / 180));
    var sc = s.s * (1 + .07 * flip + .035 * s.lift);
    el.style.transform = 'translate3d(' + s.x.toFixed(2) + 'px,' + s.y.toFixed(2) + 'px,0) rotate(' + s.rot.toFixed(3) +
      'deg) rotateY(' + s.ry.toFixed(2) + 'deg) scale(' + sc.toFixed(4) + ')';
    el.style.setProperty('--lift', Math.max(s.lift, flip).toFixed(3));
  }
  function place(el, p){ var s = st(el); stopEl(el); for (var k in p) s[k] = p[k]; s.lift = 0; apply(el); }

  // 牌背：青海波
  (function(){
    var W = 120, H = 144, R = 12, s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '"><rect width="' + W + '" height="' + H + '" fill="#a8392a"/><g fill="#a8392a" stroke="#f6e0d3" stroke-opacity=".5" stroke-width=".7">';
    for (var row = 0, y = -R; y <= H + R; y += R / 2, row++)
      for (var x = (row % 2 ? R : 0) - 2 * R; x <= W + 2 * R; x += 2 * R)
        for (var r = R; r > 1; r -= R / 4) s += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '"/>';
    s += '</g></svg>';
    document.documentElement.style.setProperty('--seigaiha', 'url("data:image/svg+xml,' + encodeURIComponent(s) + '")');
  })();

  var cards = [];
  for (var ci = 0; ci < 3; ci++) {
    var c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = '<div class="face front"><span class="kata"></span></div><div class="face back"></div>';
    deck.appendChild(c); cards.push(c);
  }
  var order = [0, 1, 2];   // 顶牌、下一张、最底
  function topCard(){ return cards[order[0]]; }

  function fitCard(el, text){
    var w = deck.clientWidth * .8, h = deck.clientHeight * .62, n = text.length, size;
    if (n === 1) size = Math.min(h * .9, w * .82);
    else if (n === 2) size = Math.min(h * .85, w / 1.7);
    else size = Math.min(h, w / n * 1.02);
    el.querySelector('.kata').style.fontSize = Math.floor(size) + 'px';
  }
  function renderCard(el, item){
    el._item = item;
    el.querySelector('.kata').textContent = item.k;
    fitCard(el, item.k);
    loadVoice(item.k);   // 提前把这张的发音下好
  }

  /* ---------- 答案 ---------- */
  var cur = null, revealed = false, busy = false;
  function applyChar(sp){ var c = sp._c; sp.style.transform = 'translateY(' + c.y.toFixed(2) + 'px) scale(' + c.s.toFixed(4) + ')'; sp.style.opacity = Math.max(0, Math.min(1, c.o)).toFixed(3); }
  function fillAnswer(){
    var hs = K.toHiragana(cur.k), n = hs.length;
    var big = window.innerHeight <= 620 ? 40 : 52;
    hira.style.fontSize = Math.floor(Math.min(big, ans.clientWidth * .94 / n)) + 'px';
    hira.innerHTML = '';
    for (var i = 0; i < n; i++) {
      var sp = document.createElement('span'); sp.textContent = hs[i];
      sp._c = {y:18, s:.4, o:0}; applyChar(sp); hira.appendChild(sp);
    }
    ro.textContent = K.toRomaji(cur.k);
    zh.textContent = cur.zh; zh.style.display = cur.zh ? '' : 'none';
  }
  function setRevealed(v){
    revealed = v;
    ans.classList.toggle('hide', !v);
    mainBtn.textContent = v ? '下一张' : '查看';
    mainBtn.classList.toggle('next', v);
  }
  function reveal(){
    if (revealed || busy) return;
    setRevealed(true);
    sfx.rin();
    // 牌轻轻一弹
    spring(st(topCard()), 's', 1, {k:700, c:14, v:.9, eps:.0008}, topCard(), apply);
    var spans = hira.children, gap = Math.min(45, 320 / spans.length);
    for (var i = 0; i < spans.length; i++) (function(sp, d){
      setTimeout(function(){
        spring(sp._c, 'y', 0, {k:520, c:19, eps:.2}, sp, applyChar);
        spring(sp._c, 's', 1, {k:560, c:16, eps:.002}, sp, applyChar);
        spring(sp._c, 'o', 1, {k:260, c:32, eps:.01}, sp, applyChar);
      }, d);
    })(spans[i], i * gap);
    speak(.14);   // 在点击当下就排好，iOS 才放行
  }

  /* ---------- 翻下一张 ---------- */
  function advance(vx, vy, om){
    if (busy) return;
    busy = true; setTimeout(function(){ busy = false; }, reduce ? 0 : 340);
    stopAudio();
    var A = cards[order[0]], B = cards[order[1]], C = cards[order[2]];
    if (C._flying) { C._flying = false; place(C, UNDER2); C.style.opacity = 1; }
    cur = draw(); renderCard(B, cur);
    setRevealed(false); fillAnswer();
    A.style.zIndex = 4; B.style.zIndex = 3; C.style.zIndex = 2;
    order = [order[1], order[2], order[0]];
    sfx.swish(Math.min(1.4, Math.max(.6, Math.hypot(vx, vy) / 1600)));

    // 顶牌被甩出去：初速度 + 重力 + 角速度
    var sA = st(A); stopEl(A); A._flying = true;
    var finishA = function(){
      if (!A._flying) return;
      A._flying = false; A.style.zIndex = 1;
      place(A, UNDER2); A.style.opacity = 0;
      requestAnimationFrame(function(){ A.style.transition = 'opacity .3s'; A.style.opacity = 1;
        setTimeout(function(){ A.style.transition = ''; }, 320); });
    };
    if (reduce) finishA();
    else run({el:A, apply:apply, t:0, done:finishA, step:function(dt){
      this.t += dt; sA.x += vx * dt; sA.y += vy * dt; vy += 2200 * dt; sA.rot += om * dt;
      sA.lift += (1 - sA.lift) * Math.min(1, dt * 10);
      var W = window.innerWidth, H = window.innerHeight;
      return !(Math.abs(sA.x) > W * .5 + deck.clientWidth || sA.y > H || this.t > 1.2);
    }});

    // 下面一张往上补
    animate(C, {x:UNDER1.x, y:UNDER1.y, rot:UNDER1.rot, s:UNDER1.s}, {k:260, c:26});
    // 下一张升起、翻面、落定
    var landed = false;
    animate(B, {x:0, y:0, rot:0, s:1, lift:0}, {k:300, c:25});
    spring(st(B), 'ry', 0, {k:190, c:17, eps:.2, onStep:function(x){
      if (!landed && x < 10) { landed = true; sfx.thock(); buzz(8); }
    }}, B, apply);
  }
  function nextByButton(){ advance(-1500, -380, -110); }

  /* ---------- 拖拽 ---------- */
  var drag = null;
  deck.addEventListener('pointerdown', function(e){
    unlockAudio();
    var el = topCard(), s = st(el);
    if (busy && Math.abs(s.ry) > 40) return;
    stopEl(el); s.ry = 0; s.s = 1; apply(el);
    var r = deck.getBoundingClientRect();
    drag = {el:el, id:e.pointerId, x0:e.clientX, y0:e.clientY, bx:s.x, by:s.y, brot:s.rot, moved:false,
            sign:(e.clientY < r.top + r.height / 2) ? 1 : -1, w:r.width, hist:[[e.timeStamp, e.clientX, e.clientY]]};
    try { deck.setPointerCapture(e.pointerId); } catch(_){}
    spring(s, 'lift', 1, {k:500, c:32, eps:.004}, el, apply);
  });
  deck.addEventListener('pointermove', function(e){
    if (!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.x0, dy = e.clientY - drag.y0, s = st(drag.el);
    if (!drag.moved && Math.hypot(dx, dy) > 7) drag.moved = true;
    if (!drag.moved) return;
    s.x = drag.bx + dx; s.y = drag.by + dy * .6;
    s.rot = drag.brot + dx / drag.w * 16 * drag.sign;
    apply(drag.el);
    drag.hist.push([e.timeStamp, e.clientX, e.clientY]);
    while (drag.hist.length > 2 && e.timeStamp - drag.hist[0][0] > 90) drag.hist.shift();
  });
  function endDrag(e){
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag; drag = null;
    var el = d.el, s = st(el);
    if (!d.moved) {
      spring(s, 'lift', 0, {k:500, c:30, eps:.004}, el, apply);
      if (e.type === 'pointerup') { revealed ? nextByButton() : reveal(); }
      return;
    }
    var h0 = d.hist[0], h1 = d.hist[d.hist.length - 1], dt = Math.max(8, h1[0] - h0[0]);
    var vx = (h1[1] - h0[1]) / dt * 1000, vy = (h1[2] - h0[2]) / dt * 1000;
    var dx = e.clientX - d.x0;
    if (Math.abs(dx) > d.w * .32 || Math.abs(vx) > 650) {
      var dir = Math.abs(vx) > 650 ? Math.sign(vx) : Math.sign(dx);
      var tvx = dir * Math.max(Math.abs(vx), 1400), tvy = Math.max(-1400, Math.min(1400, vy * .8));
      busy = false;
      advance(tvx, tvy, tvx * .06 * d.sign);
    } else {
      animate(el, {x:0, y:0, rot:0, lift:0}, {k:420, c:22});
    }
  }
  deck.addEventListener('pointerup', endDrag);
  deck.addEventListener('pointercancel', endDrag);

  /* ---------- 音效（WebAudio 现场合成） ---------- */
  var ac = null, master = null, noise = null, armedAt = -1e9;
  // iPhone 静音键开着也要出声
  function setSession(){ try { if (navigator.audioSession && navigator.audioSession.type !== 'playback') navigator.audioSession.type = 'playback'; } catch(e){} }
  function initAudio(){
    if (ac) return;
    setSession();
    try {
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ac = new AC(); master = ac.createGain(); master.gain.value = .9; master.connect(ac.destination);
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      var d = noise.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch(e){ ac = null; }
  }
  // iOS 只认 touchend / click / keydown 这类手势里的解锁
  function unlockAudio(e){
    initAudio(); if (!ac) return;
    setSession();
    try {
      if (ac.state !== 'running') {
        ac.resume();
        var s = ac.createBufferSource(); s.buffer = ac.createBuffer(1, 1, 22050); s.connect(ac.destination); s.start(0);
      }
      if (e && /^(touchend|click|keydown|pointerup)$/.test(e.type)) armedAt = performance.now();
    } catch(err){}
  }
  function live(){ return !!ac && (ac.state === 'running' || performance.now() - armedAt < 1500); }
  ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach(function(t){ document.addEventListener(t, unlockAudio, true); });
  function env(g, t, a, p, d){ g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(p, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d); }
  function noiseSrc(t, dur){ var n = ac.createBufferSource(); n.buffer = noise; n.start(t, Math.random() * .6, dur); return n; }
  var sfx = {
    // 纸牌划过空气
    swish: function(I){ if (!live()) return; try {
      var t = ac.currentTime, n = noiseSrc(t, .32), bp = ac.createBiquadFilter(), g = ac.createGain();
      bp.type = 'bandpass'; bp.Q.value = .9;
      bp.frequency.setValueAtTime(650, t); bp.frequency.exponentialRampToValueAtTime(2900, t + .17);
      env(g, t, .03, .2 * (I || 1), .18); n.connect(bp); bp.connect(g); g.connect(master);
    } catch(e){} },
    // 牌落在桌上
    thock: function(){ if (!live()) return; try {
      var t = ac.currentTime, f = 165 * (.94 + Math.random() * .12);
      var o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * .45, t + .1);
      env(g, t, .004, .45, .13); o.connect(g); g.connect(master); o.start(t); o.stop(t + .2);
      var n = noiseSrc(t, .1), lp = ac.createBiquadFilter(), g2 = ac.createGain();
      lp.type = 'lowpass'; lp.frequency.value = 1700;
      env(g2, t, .002, .26, .05); n.connect(lp); lp.connect(g2); g2.connect(master);
    } catch(e){} },
    // 揭晓：小铃
    rin: function(){ if (!live()) return; try {
      var t = ac.currentTime, f = 1175;
      [[1, .1, 1.5], [1.004, .07, 1.4], [2.71, .035, .7], [5.2, .012, .3]].forEach(function(p){
        var o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = f * p[0]; env(g, t, .004, p[1], p[2]);
        o.connect(g); g.connect(master); o.start(t); o.stop(t + p[2] + .1);
      });
    } catch(e){} },
    // 切换
    tick: function(){ if (!live()) return; try {
      var t = ac.currentTime, n = noiseSrc(t, .06), bp = ac.createBiquadFilter(), g = ac.createGain();
      bp.type = 'bandpass'; bp.frequency.value = 3200; bp.Q.value = 2;
      env(g, t, .001, .22, .035); n.connect(bp); bp.connect(g); g.connect(master);
    } catch(e){} }
  };
  function buzz(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){} }

  /* ---------- 发音：预录音频走 WebAudio（解锁一次后随时能播），不行再用 <audio>，最后系统朗读 ---------- */
  var voices = {}, voiceKeys = [], srcNode = null, audio = null, token = 0;
  function voiceUrl(text){ return 'audio/' + K.audioName(text) + '.mp3'; }
  function loadVoice(text){
    if (!ac || !window.fetch || !window.Promise) return null;
    if (voices[text]) return voices[text];
    var p = fetch(voiceUrl(text)).then(function(r){ if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then(function(ab){ return new Promise(function(res, rej){ ac.decodeAudioData(ab, res, rej); }); });
    p.catch(function(){ delete voices[text]; });
    voiceKeys.push(text);
    if (voiceKeys.length > 12) delete voices[voiceKeys.shift()];
    return (voices[text] = p);
  }
  function stopAudio(){
    token++;
    if (srcNode) { try { srcNode.stop(); } catch(e){} srcNode = null; }
    if (audio) { try { audio.pause(); } catch(e){} audio = null; }
    voice.classList.remove('playing');
    if (window.speechSynthesis) try { speechSynthesis.cancel(); } catch(e){}
  }
  function speak(delay){
    stopAudio();
    var text = cur.k, my = token, p = loadVoice(text);
    voice.classList.add('playing');
    if (!p) { playEl(text, my); return; }
    p.then(function(buf){
      if (my !== token) return;
      if (!live()) { playEl(text, my); return; }
      var s = ac.createBufferSource(); s.buffer = buf; s.connect(ac.destination);
      s.onended = function(){ if (my === token) voice.classList.remove('playing'); };
      s.start(ac.currentTime + (delay || 0)); srcNode = s;
    }, function(){ if (my === token) playEl(text, my); });
  }
  function playEl(text, my){
    var a = new Audio(voiceUrl(text)); audio = a;
    a.onended = function(){ if (my === token) voice.classList.remove('playing'); };
    a.onerror = function(){ if (my === token) fallback(text); };
    var p = a.play(); if (p && p.catch) p.catch(function(){ if (my === token) fallback(text); });
  }
  function fallback(text){
    voice.classList.remove('playing');
    if (!window.speechSynthesis) return;
    try {
      var u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP'; u.rate = .85;
      var v = speechSynthesis.getVoices().filter(function(x){ return /^ja/i.test(x.lang); })[0]; if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch(e){}
  }

  /* ---------- 按钮 ---------- */
  document.addEventListener('touchstart', function(){}, {passive:true}); // iOS 上让 :active 生效
  mainBtn.addEventListener('pointerdown', unlockAudio);
  voice.addEventListener('pointerdown', unlockAudio);
  mainBtn.onclick = function(){ revealed ? nextByButton() : reveal(); };
  ans.onclick = function(){ unlockAudio(); if (!revealed) reveal(); };
  voice.onclick = function(){ unlockAudio(); speak(0); };

  var segBtns = document.querySelectorAll('#seg button'), th = {x:0};
  function applyThumb(){ thumb.style.transform = 'translateX(' + th.x.toFixed(2) + 'px)'; }
  function syncSeg(anim){
    var idx = mode === 'word' ? 1 : 0;
    for (var i = 0; i < segBtns.length; i++) segBtns[i].classList.toggle('on', i === idx);
    var to = idx * 80;
    if (anim) spring(th, 'x', to, {k:420, c:24, eps:.2}, thumb, applyThumb); else { th.x = to; applyThumb(); }
  }
  for (var bi = 0; bi < segBtns.length; bi++) segBtns[bi].onclick = function(){
    unlockAudio();
    var m = this.getAttribute('data-mode');
    if (m === mode || busy) return;
    mode = m; syncSeg(true); sfx.tick();
    try { localStorage.setItem('kc-mode', mode); } catch(e){}
    nextByButton();
  };

  document.addEventListener('keydown', function(e){
    unlockAudio();
    if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); revealed ? nextByButton() : reveal(); }
    else if (e.key === 'ArrowLeft') advance(-1600, -300, -110);
    else if (e.key === 'ArrowRight') advance(1600, -300, 110);
    else if (e.key === 's' || e.key === 'ArrowUp') speak();
  });
  window.addEventListener('resize', function(){ cards.forEach(function(c){ if (c._item) fitCard(c, c._item.k); }); if (cur) fillAnswer(); setRevealed(revealed); if (revealed) for (var i = 0; i < hira.children.length; i++) { var sp = hira.children[i]; sp._c = {y:0, s:1, o:1}; applyChar(sp); } });

  /* ---------- 开局：发一张，翻过来 ---------- */
  initAudio();
  syncSeg(false);
  cur = draw();
  var first = cards[0];
  renderCard(first, cur); fillAnswer();
  place(cards[2], UNDER2); cards[2].style.zIndex = 1;
  place(cards[1], UNDER1); cards[1].style.zIndex = 2;
  place(first, {x:0, y:14, rot:-2.4, ry:180, s:.95}); first.style.zIndex = 3;
  busy = true;
  setTimeout(function(){
    animate(first, {x:0, y:0, rot:0, s:1}, {k:300, c:25});
    spring(st(first), 'ry', 0, {k:190, c:17, eps:.2, onStep:function(x){ if (x < 10) busy = false; }}, first, apply, function(){ busy = false; });
    if (reduce) busy = false;
  }, 260);
})();
</script>
